<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PixelBras - Editor WebGL</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background-color: #121214;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    touch-action: none;
  }
  .tool-btn.active {
    border-color: #04d361 !important;
    color: #04d361 !important;
    background-color: rgba(4, 211, 97, 0.15) !important;
  }
</style>
</head>
<body class="flex flex-col justify-between text-zinc-200 font-sans">

  <!-- Barra Superior: Marca, Cor e Ferramentas -->
  <header class="w-full bg-zinc-900 border-b border-zinc-800 px-2 py-2 flex items-center justify-between gap-1 shrink-0 z-10">
    <div class="flex items-center gap-1.5 pl-1">
      <svg class="w-5 h-5 text-emerald-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
      </svg>
      <span class="font-bold text-sm tracking-tight hidden sm:inline">PixelBras</span>
    </div>

    <div class="flex items-center gap-1 overflow-x-auto no-scrollbar">
      <label class="relative w-9 h-9 rounded-lg overflow-hidden border-2 border-zinc-700 shrink-0 cursor-pointer" title="Cor">
        <input type="color" id="colorPicker" value="#04d361" class="absolute -inset-2 w-14 h-14 cursor-pointer border-0 p-0">
      </label>

      <button id="tool-brush" class="tool-btn active flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold shrink-0" title="Pincel (B)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/></svg>
        <span class="hidden md:inline">Pincel</span>
      </button>

      <button id="tool-bucket" class="tool-btn flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold shrink-0" title="Balde (G)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
        <span class="hidden md:inline">Balde</span>
      </button>

      <button id="tool-picker" class="tool-btn flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold shrink-0" title="Conta-Gotas (I)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>
        <span class="hidden md:inline">Gotas</span>
      </button>

      <button id="tool-line" class="tool-btn flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold shrink-0" title="Linha (L)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
        <span class="hidden md:inline">Linha</span>
      </button>

      <button id="tool-rect" class="tool-btn flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold shrink-0" title="Retângulo (R)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        <span class="hidden md:inline">Retângulo</span>
      </button>

      <button id="tool-eraser" class="tool-btn flex items-center gap-1.5 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold shrink-0" title="Borracha (E)">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        <span class="hidden md:inline">Borracha</span>
      </button>
    </div>
  </header>

  <!-- Área Central: Canvas ajustado dinamicamente para ocupar o máximo da tela -->
  <main id="workspace" class="flex-1 w-full flex items-center justify-center p-2 overflow-hidden relative">
    <canvas id="glcanvas" width="512" height="512" class="border-2 border-zinc-700 shadow-2xl rounded-sm cursor-crosshair"></canvas>
  </main>

  <!-- Barra Inferior: Undo/Redo, Grade, Limpar e Exportar -->
  <footer class="w-full bg-zinc-900 border-t border-zinc-800 px-3 py-2 flex items-center justify-between gap-2 shrink-0 z-10">
    <div class="flex items-center gap-1.5">
      <button id="btnUndo" disabled class="flex items-center gap-1 px-3 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold disabled:opacity-35 active:scale-95 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
        <span>Undo</span>
      </button>
      <button id="btnRedo" disabled class="flex items-center gap-1 px-3 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold disabled:opacity-35 active:scale-95 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
        <span>Redo</span>
      </button>
    </div>

    <div id="coords" class="text-xs font-mono text-zinc-400">0, 0</div>

    <div class="flex items-center gap-1.5">
      <button id="btnGrid" class="tool-btn active flex items-center gap-1 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold active:scale-95 transition" title="Grade">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
      </button>
      <button id="btnClear" class="flex items-center gap-1 px-2.5 py-2 rounded-lg bg-zinc-800 border border-zinc-700 text-xs font-semibold text-red-400 active:scale-95 transition" title="Limpar">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
      </button>
      <button id="btnExport" class="flex items-center gap-1 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-zinc-950 text-xs font-bold active:scale-95 transition" title="Salvar PNG">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span>PNG</span>
      </button>
    </div>
  </footer>

<script>
  const GRID = 32;
  const BG_COLOR = [24, 24, 28, 255];
  const canvas = document.getElementById('glcanvas');
  const workspace = document.getElementById('workspace');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

  // Ajusta o canvas para ocupar o maior quadrado possível na tela (Mobile e Desktop)
  function fitCanvas() {
    const rect = workspace.getBoundingClientRect();
    const size = Math.floor(Math.min(rect.width - 12, rect.height - 12));
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
  }
  window.addEventListener('resize', fitCanvas);
  fitCanvas();

  // Shaders WebGL
  const vsSource = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;
      v_uv.y = 1.0 - v_uv.y;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision mediump float;
    varying vec2 v_uv;
    uniform sampler2D u_tex;
    uniform float u_grid;
    uniform float u_showGrid;
    void main() {
      vec4 color = texture2D(u_tex, v_uv);
      if (u_showGrid > 0.5) {
        vec2 gridPos = fract(v_uv * u_grid);
        float line = step(0.95, gridPos.x) + step(0.95, gridPos.y);
        gl_FragColor = mix(color, vec4(0.25, 0.25, 0.28, 1.0), min(line, 1.0) * 0.4);
      } else {
        gl_FragColor = color;
      }
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  const uGridLoc = gl.getUniformLocation(prog, 'u_grid');
  const uShowGridLoc = gl.getUniformLocation(prog, 'u_showGrid');
  gl.uniform1f(uGridLoc, GRID);
  gl.uniform1f(uShowGridLoc, 1.0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  let pixels = new Uint8Array(GRID * GRID * 4);
  let snapshot = null;
  const undoStack = [];
  const redoStack = [];

  function saveState() {
    undoStack.push(new Uint8Array(pixels));
    redoStack.length = 0;
    updateHistoryUI();
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(new Uint8Array(pixels));
    pixels = undoStack.pop();
    render();
    updateHistoryUI();
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(new Uint8Array(pixels));
    pixels = redoStack.pop();
    render();
    updateHistoryUI();
  }

  function updateHistoryUI() {
    document.getElementById('btnUndo').disabled = undoStack.length === 0;
    document.getElementById('btnRedo').disabled = redoStack.length === 0;
  }

  function render(buffer = pixels) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GRID, GRID, 0, gl.RGBA, gl.UNSIGNED_BYTE, buffer);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  let currentTool = 'brush';
  let isDrawing = false;
  let startX = 0, startY = 0;
  let lastX = 0, lastY = 0;
  let showGrid = true;
  const colorPicker = document.getElementById('colorPicker');

  function hexToRgba(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16),
      255
    ];
  }

  function rgbaToHex(r, g, b) {
    return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
  }

  function setPixel(buf, x, y, rgba) {
    if (x < 0 || x >= GRID || y < 0 || y >= GRID) return;
    const idx = (y * GRID + x) * 4;
    buf[idx] = rgba[0]; buf[idx+1] = rgba[1]; buf[idx+2] = rgba[2]; buf[idx+3] = rgba[3];
  }

  function getPixel(buf, x, y) {
    const idx = (y * GRID + x) * 4;
    return [buf[idx], buf[idx+1], buf[idx+2], buf[idx+3]];
  }

  function colorsMatch(c1, c2) {
    return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
  }

  function floodFill(x, y, fillColor) {
    const targetColor = getPixel(pixels, x, y);
    if (colorsMatch(targetColor, fillColor)) return false;

    const stack = [[x, y]];
    const visited = new Uint8Array(GRID * GRID);

    while (stack.length > 0) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cx >= GRID || cy < 0 || cy >= GRID) continue;
      const vIdx = cy * GRID + cx;
      if (visited[vIdx]) continue;
      visited[vIdx] = 1;

      if (colorsMatch(getPixel(pixels, cx, cy), targetColor)) {
        setPixel(pixels, cx, cy, fillColor);
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
    }
    return true;
  }

  function drawLine(buf, x0, y0, x1, y1, color) {
    let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      setPixel(buf, x0, y0, color);
      if (x0 === x1 && y0 === y1) break;
      let e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  function drawRect(buf, x0, y0, x1, y1, color) {
    const minX = Math.min(x0, x1), maxX = Math.max(x0, x1);
    const minY = Math.min(y0, y1), maxY = Math.max(y0, y1);
    for (let x = minX; x <= maxX; x++) {
      setPixel(buf, x, minY, color);
      setPixel(buf, x, maxY, color);
    }
    for (let y = minY; y <= maxY; y++) {
      setPixel(buf, minX, y, color);
      setPixel(buf, maxX, y, color);
    }
  }

  const tools = ['brush', 'bucket', 'picker', 'line', 'rect', 'eraser'];
  function selectTool(name) {
    currentTool = name;
    tools.forEach(t => {
      document.getElementById(`tool-${t}`).classList.toggle('active', t === name);
    });
  }
  tools.forEach(t => {
    document.getElementById(`tool-${t}`).addEventListener('click', () => selectTool(t));
  });

  // Extrai coordenadas tanto de Touch quanto de Mouse
  function getCoordsFromClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(((clientX - rect.left) / rect.width) * GRID);
    const y = Math.floor(((clientY - rect.top) / rect.height) * GRID);
    return [Math.max(0, Math.min(GRID - 1, x)), Math.max(0, Math.min(GRID - 1, y))];
  }

  function handleStart(clientX, clientY) {
    const [x, y] = getCoordsFromClient(clientX, clientY);
    lastX = x; lastY = y;
    document.getElementById('coords').textContent = `${x}, ${y}`;
    const activeColor = currentTool === 'eraser' ? BG_COLOR : hexToRgba(colorPicker.value);

    if (currentTool === 'picker') {
      const picked = getPixel(pixels, x, y);
      colorPicker.value = rgbaToHex(picked[0], picked[1], picked[2]);
      selectTool('brush');
      return;
    }

    if (currentTool === 'bucket') {
      saveState();
      if (!floodFill(x, y, activeColor)) {
        undoStack.pop();
        updateHistoryUI();
      }
      render();
      return;
    }

    saveState();
    isDrawing = true;
    startX = x;
    startY = y;
    snapshot = new Uint8Array(pixels);

    if (currentTool === 'brush' || currentTool === 'eraser') {
      setPixel(pixels, x, y, activeColor);
      render();
    }
  }

  function handleMove(clientX, clientY) {
    const [x, y] = getCoordsFromClient(clientX, clientY);
    document.getElementById('coords').textContent = `${x}, ${y}`;
    if (!isDrawing) return;

    lastX = x; lastY = y;
    const activeColor = currentTool === 'eraser' ? BG_COLOR : hexToRgba(colorPicker.value);

    if (currentTool === 'brush' || currentTool === 'eraser') {
      drawLine(pixels, startX, startY, x, y, activeColor);
      startX = x; startY = y;
      render();
    } else if (currentTool === 'line') {
      const preview = new Uint8Array(snapshot);
      drawLine(preview, startX, startY, x, y, activeColor);
      render(preview);
    } else if (currentTool === 'rect') {
      const preview = new Uint8Array(snapshot);
      drawRect(preview, startX, startY, x, y, activeColor);
      render(preview);
    }
  }

  function handleEnd() {
    if (!isDrawing) return;
    const activeColor = hexToRgba(colorPicker.value);

    if (currentTool === 'line') {
      drawLine(pixels, startX, startY, lastX, lastY, activeColor);
      render();
    } else if (currentTool === 'rect') {
      drawRect(pixels, startX, startY, lastX, lastY, activeColor);
      render();
    }
    isDrawing = false;
    snapshot = null;
  }

  // Eventos Touch Nativos (Mobile/Tablet)
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      handleStart(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      handleMove(e.touches[0].clientX, e.touches[0].clientY);
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleEnd();
  }, { passive: false });

  canvas.addEventListener('touchcancel', (e) => {
    e.preventDefault();
    handleEnd();
  }, { passive: false });

  // Eventos Mouse Nativos (Desktop)
  canvas.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    handleStart(e.clientX, e.clientY);
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDrawing && e.target !== canvas) return;
    handleMove(e.clientX, e.clientY);
  });

  window.addEventListener('mouseup', () => {
    handleEnd();
  });

  // Botões
  document.getElementById('btnUndo').addEventListener('click', undo);
  document.getElementById('btnRedo').addEventListener('click', redo);
  
  document.getElementById('btnGrid').addEventListener('click', (e) => {
    showGrid = !showGrid;
    gl.uniform1f(uShowGridLoc, showGrid ? 1.0 : 0.0);
    e.currentTarget.classList.toggle('active', showGrid);
    render();
  });

  document.getElementById('btnClear').addEventListener('click', () => {
    saveState();
    for (let i = 0; i < pixels.length; i += 4) {
      pixels[i] = BG_COLOR[0]; pixels[i+1] = BG_COLOR[1]; pixels[i+2] = BG_COLOR[2]; pixels[i+3] = BG_COLOR[3];
    }
    render();
  });

  document.getElementById('btnExport').addEventListener('click', () => {
    gl.uniform1f(uShowGridLoc, 0.0);
    render();
    const a = document.createElement('a');
    a.download = 'pixelbras-art.png';
    a.href = canvas.toDataURL();
    a.click();
    gl.uniform1f(uShowGridLoc, showGrid ? 1.0 : 0.0);
    render();
  });

  // Atalhos Teclado
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      redo();
    } else if (!e.ctrlKey && !e.metaKey) {
      const key = e.key.toLowerCase();
      if (key === 'b') selectTool('brush');
      if (key === 'g') selectTool('bucket');
      if (key === 'i') selectTool('picker');
      if (key === 'l') selectTool('line');
      if (key === 'r') selectTool('rect');
      if (key === 'e') selectTool('eraser');
    }
  });

  // Inicialização
  for (let i = 0; i < pixels.length; i += 4) {
    pixels[i] = BG_COLOR[0]; pixels[i+1] = BG_COLOR[1]; pixels[i+2] = BG_COLOR[2]; pixels[i+3] = BG_COLOR[3];
  }
  render();
</script>
</body>
</html>
