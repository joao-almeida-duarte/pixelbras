<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>PixelBras - Editor WebGL</title>
<style>
  body { margin: 0; background: #121214; color: #e1e1e6; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; user-select: none; }
  .toolbar { display: flex; gap: 12px; align-items: center; background: #202024; padding: 10px 20px; border-radius: 8px; margin-bottom: 16px; border: 1px solid #323238; }
  button { background: #29292e; color: #e1e1e6; border: 1px solid #323238; padding: 8px 12px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: bold; }
  button:hover { background: #323238; }
  button.active { border-color: #04d361; color: #04d361; }
  input[type="color"] { border: none; width: 32px; height: 32px; cursor: pointer; background: none; }
  canvas { border: 2px solid #323238; image-rendering: pixelated; cursor: crosshair; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
</style>
</head>
<body>

<div class="toolbar">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#04d361" stroke-width="2">
    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
  </svg>
  <strong>PixelBras</strong>
  <input type="color" id="colorPicker" value="#04d361" title="Cor do Pincel">
  <button id="btnBrush" class="active">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/></svg>
    Pincel
  </button>
  <button id="btnEraser">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    Borracha
  </button>
  <button id="btnClear">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
    Limpar
  </button>
  <button id="btnExport">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Salvar PNG
  </button>
</div>

<canvas id="glcanvas" width="512" height="512"></canvas>

<script>
  const GRID = 32;
  const canvas = document.getElementById('glcanvas');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

  const vsSource = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;
      v_uv.y = 1.0 - v_uv.y;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision mediump float;
    varying vec2 v_uv;
    uniform sampler2D u_tex;
    uniform float u_grid;
    void main() {
      vec4 color = texture2D(u_tex, v_uv);
      vec2 gridPos = fract(v_uv * u_grid);
      float line = step(0.95, gridPos.x) + step(0.95, gridPos.y);
      gl_FragColor = mix(color, vec4(0.22, 0.22, 0.25, 1.0), min(line, 1.0) * 0.35);
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  gl.uniform1f(gl.getUniformLocation(prog, 'u_grid'), GRID);

  const pixels = new Uint8Array(GRID * GRID * 4);
  function clearGrid() {
    for (let i = 0; i < pixels.length; i += 4) {
      pixels[i] = 24; pixels[i+1] = 24; pixels[i+2] = 28; pixels[i+3] = 255;
    }
    updateTexture();
  }

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function updateTexture() {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GRID, GRID, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  let drawing = false;
  let erasing = false;
  const colorPicker = document.getElementById('colorPicker');
  const btnBrush = document.getElementById('btnBrush');
  const btnEraser = document.getElementById('btnEraser');

  btnBrush.onclick = () => { erasing = false; btnBrush.classList.add('active'); btnEraser.classList.remove('active'); };
  btnEraser.onclick = () => { erasing = true; btnEraser.classList.add('active'); btnBrush.classList.remove('active'); };
  document.getElementById('btnClear').onclick = clearGrid;
  document.getElementById('btnExport').onclick = () => {
    const a = document.createElement('a');
    a.download = 'pixelbras-art.png';
    a.href = canvas.toDataURL();
    a.click();
  };

  function paint(e) {
    if (!drawing) return;
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(((e.clientX - rect.left) / rect.width) * GRID);
    const y = Math.floor(((e.clientY - rect.top) / rect.height) * GRID);
    if (x < 0 || x >= GRID || y < 0 || y >= GRID) return;

    const idx = (y * GRID + x) * 4;
    if (erasing) {
      pixels[idx] = 24; pixels[idx+1] = 24; pixels[idx+2] = 28;
    } else {
      const hex = colorPicker.value;
      pixels[idx] = parseInt(hex.slice(1,3), 16);
      pixels[idx+1] = parseInt(hex.slice(3,5), 16);
      pixels[idx+2] = parseInt(hex.slice(5,7), 16);
    }
    updateTexture();
  }

  canvas.onmousedown = (e) => { drawing = true; paint(e); };
  window.onmouseup = () => drawing = false;
  canvas.onmousemove = paint;

  clearGrid();
</script>
</body>
</html>
