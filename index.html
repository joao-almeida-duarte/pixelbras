<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PixelBras - Editor WebGL</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    margin: 0; padding: 12px; background: #121214; color: #e1e1e6; 
    font-family: system-ui, sans-serif; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; min-height: 100dvh; 
    user-select: none; overflow-x: hidden;
  }
  .toolbar { 
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center;
    background: #202024; padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; 
    border: 1px solid #323238; width: 100%; max-width: 640px; 
  }
  .divider { width: 1px; height: 24px; background: #323238; margin: 0 2px; }
  button { 
    background: #29292e; color: #e1e1e6; border: 1px solid #323238; 
    padding: 8px 10px; border-radius: 6px; cursor: pointer; 
    display: flex; align-items: center; justify-content: center; gap: 6px; 
    font-size: 13px; font-weight: 600; transition: 0.15s; min-height: 38px;
  }
  button:hover:not(:disabled) { background: #323238; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.active { border-color: #04d361; color: #04d361; background: rgba(4, 211, 97, 0.12); }
  input[type="color"] { border: none; width: 38px; height: 38px; cursor: pointer; background: none; padding: 0; border-radius: 6px; }
  canvas { 
    border: 2px solid #323238; image-rendering: pixelated; cursor: crosshair; 
    box-shadow: 0 8px 32px rgba(0,0,0,0.6); touch-action: none; 
    width: min(92vw, 512px); height: min(92vw, 512px);
  }
  .status { 
    margin-top: 10px; font-size: 12px; color: #8d8d99; display: flex; 
    flex-wrap: wrap; justify-content: center; gap: 12px; text-align: center; 
  }
  @media (max-width: 520px) {
    .btn-label { display: none; }
    button { padding: 8px 11px; }
    .shortcuts-hint { display: none; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#04d361" stroke-width="2">
    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
    <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
  </svg>
  <strong>PixelBras</strong>
  <div class="divider"></div>
  
  <input type="color" id="colorPicker" value="#04d361" title="Cor Atual">
  
  <button id="tool-brush" class="active" title="Pincel (B)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3Z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/></svg>
    <span class="btn-label">Pincel</span>
  </button>
  
  <button id="tool-bucket" title="Balde de Tinta (G)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></svg>
    <span class="btn-label">Balde</span>
  </button>

  <button id="tool-picker" title="Conta-Gotas (I)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m2 22 1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z"/></svg>
    <span class="btn-label">Gotas</span>
  </button>

  <button id="tool-line" title="Linha Reta (L)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="19" x2="19" y2="5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
    <span class="btn-label">Linha</span>
  </button>

  <button id="tool-rect" title="Retângulo (R)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
    <span class="btn-label">Retângulo</span>
  </button>

  <button id="tool-eraser" title="Borracha (E)">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
    <span class="btn-label">Borracha</span>
  </button>

  <div class="divider"></div>

  <button id="btnUndo" title="Desfazer (Ctrl+Z)" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/></svg>
    <span class="btn-label">Undo</span>
  </button>

  <button id="btnRedo" title="Refazer (Ctrl+Y)" disabled>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"/><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/></svg>
    <span class="btn-label">Redo</span>
  </button>

  <button id="btnGrid" class="active" title="Alternar Grade">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
    <span class="btn-label">Grade</span>
  </button>

  <button id="btnClear" title="Limpar Tela">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/></svg>
    <span class="btn-label">Limpar</span>
  </button>

  <button id="btnExport" title="Baixar PNG">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    <span class="btn-label">PNG</span>
  </button>
</div>

<canvas id="glcanvas" width="512" height="512"></canvas>

<div class="status">
  <span id="coords">Posição: 0, 0</span>
  <span id="historyInfo">Histórico: 0 undo / 0 redo</span>
  <span class="shortcuts-hint">Atalhos: B | G | I | L | R | E | Ctrl+Z / Ctrl+Y</span>
</div>

<script>
  const GRID = 32;
  const BG_COLOR = [24, 24, 28, 255];
  const canvas = document.getElementById('glcanvas');
  const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });

  const vsSource = `
    attribute vec2 a_pos;
    varying vec2 v_uv;
    void main() {
      v_uv = a_pos * 0.5 + 0.5;
      v_uv.y = 1.0 - v_uv.y;
      gl_Position = vec4(a_pos, 0.0, 1.0);
    }
  `;

  const fsSource = `
    precision mediump float;
    varying vec2 v_uv;
    uniform sampler2D u_tex;
    uniform float u_grid;
    uniform float u_showGrid;
    void main() {
      vec4 color = texture2D(u_tex, v_uv);
      if (u_showGrid > 0.5) {
        vec2 gridPos = fract(v_uv * u_grid);
        float line = step(0.95, gridPos.x) + step(0.95, gridPos.y);
        gl_FragColor = mix(color, vec4(0.25, 0.25, 0.28, 1.0), min(line, 1.0) * 0.4);
      } else {
        gl_FragColor = color;
      }
    }
  `;

  function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  const prog = gl.createProgram();
  gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsSource));
  gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsSource));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const posLoc = gl.getAttribLocation(prog, 'a_pos');
  gl.enableVertexAttribArray(posLoc);
  gl.vertexAttribPointer(posLoc, 2, gl.FLOAT, false, 0, 0);

  const uGridLoc = gl.getUniformLocation(prog, 'u_grid');
  const uShowGridLoc = gl.getUniformLocation(prog, 'u_showGrid');
  gl.uniform1f(uGridLoc, GRID);
  gl.uniform1f(uShowGridLoc, 1.0);

  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  let pixels = new Uint8Array(GRID * GRID * 4);
  let snapshot = null;
  const undoStack = [];
  const redoStack = [];

  function saveState() {
    undoStack.push(new Uint8Array(pixels));
    redoStack.length = 0;
    updateHistoryUI();
  }

  function undo() {
    if (undoStack.length === 0) return;
    redoStack.push(new Uint8Array(pixels));
    pixels = undoStack.pop();
    render();
    updateHistoryUI();
  }

  function redo() {
    if (redoStack.length === 0) return;
    undoStack.push(new Uint8Array(pixels));
    pixels = redoStack.pop();
    render();
    updateHistoryUI();
  }

  function updateHistoryUI() {
    document.getElementById('btnUndo').disabled = undoStack.length === 0;
    document.getElementById('btnRedo').disabled = redoStack.length === 0;
    document.getElementById('historyInfo').textContent = `Histórico: ${undoStack.length} undo / ${redoStack.length} redo`;
  }

  function render(buffer = pixels) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, GRID, GRID, 0, gl.RGBA, gl.UNSIGNED_BYTE, buffer);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  let currentTool = 'brush';
  let isDrawing = false;
  let activePointerId = null;
  let startX = 0, startY = 0;
  let showGrid = true;
  const colorPicker = document.getElementById('colorPicker');

  function hexToRgba(hex) {
    return [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16),
      255
    ];
  }

  function rgbaToHex(r, g, b) {
    return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
  }

  function setPixel(buf, x, y, rgba) {
    if (x < 0 || x >= GRID || y < 0 || y >= GRID) return;
    const idx = (y * GRID + x) * 4;
    buf[idx] = rgba[0]; buf[idx+1] = rgba[1]; buf[idx+2] = rgba[2]; buf[idx+3] = rgba[3];
  }

  function getPixel(buf, x, y) {
    const idx = (y * GRID + x) * 4;
    return [buf[idx], buf[idx+1], buf[idx+2], buf[idx+3]];
  }

  function colorsMatch(c1, c2) {
    return c1[0] === c2[0] && c1[1] === c2[1] && c1[2] === c2[2] && c1[3] === c2[3];
  }

  function floodFill(x, y, fillColor) {
    const targetColor = getPixel(pixels, x, y);
    if (colorsMatch(targetColor, fillColor)) return false;

    const stack = [[x, y]];
    const visited = new Uint8Array(GRID * GRID);

    while (stack.length > 0) {
      const [cx, cy] = stack.pop();
      if (cx < 0 || cx >= GRID || cy < 0 || cy >= GRID) continue;
      const vIdx = cy * GRID + cx;
      if (visited[vIdx]) continue;
      visited[vIdx] = 1;

      if (colorsMatch(getPixel(pixels, cx, cy), targetColor)) {
        setPixel(pixels, cx, cy, fillColor);
        stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
      }
    }
    return true;
  }

  function drawLine(buf, x0, y0, x1, y1, color) {
    let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      setPixel(buf, x0, y0, color);
      if (x0 === x1 && y0 === y1) break;
      let e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

  function drawRect(buf, x0, y0, x1, y1, color) {
    const minX = Math.min(x0, x1), maxX = Math.max(x0, x1);
    const minY = Math.min(y0, y1), maxY = Math.max(y0, y1);
    for (let x = minX; x <= maxX; x++) {
      setPixel(buf, x, minY, color);
      setPixel(buf, x, maxY, color);
    }
    for (let y = minY; y <= maxY; y++) {
      setPixel(buf, minX, y, color);
      setPixel(buf, maxX, y, color);
    }
  }

  const tools = ['brush', 'bucket', 'picker', 'line', 'rect', 'eraser'];
  function selectTool(name) {
    currentTool = name;
    tools.forEach(t => {
      document.getElementById(`tool-${t}`).classList.toggle('active', t === name);
    });
  }
  tools.forEach(t => {
    document.getElementById(`tool-${t}`).onclick = () => selectTool(t);
  });

  function getGridCoords(e) {
    const rect = canvas.getBoundingClientRect();
    const x = Math.floor(((e.clientX - rect.left) / rect.width) * GRID);
    const y = Math.floor(((e.clientY - rect.top) / rect.height) * GRID);
    return [Math.max(0, Math.min(GRID - 1, x)), Math.max(0, Math.min(GRID - 1, y))];
  }

  // Suporte unificado Mouse + Touch + Caneta (Pointer Events)
  canvas.addEventListener('pointerdown', (e) => {
    if (activePointerId !== null) return; // Ignora segundo dedo (pinch/scroll acidental)
    activePointerId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);

    const [x, y] = getGridCoords(e);
    document.getElementById('coords').textContent = `Posição: ${x}, ${y}`;
    const activeColor = currentTool === 'eraser' ? BG_COLOR : hexToRgba(colorPicker.value);

    if (currentTool === 'picker') {
      const picked = getPixel(pixels, x, y);
      colorPicker.value = rgbaToHex(picked[0], picked[1], picked[2]);
      selectTool('brush');
      activePointerId = null;
      return;
    }

    if (currentTool === 'bucket') {
      saveState();
      if (!floodFill(x, y, activeColor)) {
        undoStack.pop();
        updateHistoryUI();
      }
      render();
      activePointerId = null;
      return;
    }

    saveState();
    isDrawing = true;
    startX = x;
    startY = y;
    snapshot = new Uint8Array(pixels);

    if (currentTool === 'brush' || currentTool === 'eraser') {
      setPixel(pixels, x, y, activeColor);
      render();
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (e.pointerId !== activePointerId && e.pointerType !== 'mouse') return;
    const [x, y] = getGridCoords(e);
    document.getElementById('coords').textContent = `Posição: ${x}, ${y}`;

    if (!isDrawing || e.pointerId !== activePointerId) return;
    const activeColor = currentTool === 'eraser' ? BG_COLOR : hexToRgba(colorPicker.value);

    if (currentTool === 'brush' || currentTool === 'eraser') {
      drawLine(pixels, startX, startY, x, y, activeColor);
      startX = x; startY = y;
      render();
    } else if (currentTool === 'line') {
      const preview = new Uint8Array(snapshot);
      drawLine(preview, startX, startY, x, y, activeColor);
      render(preview);
    } else if (currentTool === 'rect') {
      const preview = new Uint8Array(snapshot);
      drawRect(preview, startX, startY, x, y, activeColor);
      render(preview);
    }
  });

  function finishStroke(e) {
    if (e.pointerId !== activePointerId) return;
    if (isDrawing) {
      const [x, y] = getGridCoords(e);
      const activeColor = hexToRgba(colorPicker.value);

      if (currentTool === 'line') {
        drawLine(pixels, startX, startY, x, y, activeColor);
        render();
      } else if (currentTool === 'rect') {
        drawRect(pixels, startX, startY, x, y, activeColor);
        render();
      }
    }
    isDrawing = false;
    snapshot = null;
    activePointerId = null;
  }

  canvas.addEventListener('pointerup', finishStroke);
  canvas.addEventListener('pointercancel', finishStroke);

  document.getElementById('btnUndo').onclick = undo;
  document.getElementById('btnRedo').onclick = redo;
  
  document.getElementById('btnGrid').onclick = (e) => {
    showGrid = !showGrid;
    gl.uniform1f(uShowGridLoc, showGrid ? 1.0 : 0.0);
    e.currentTarget.classList.toggle('active', showGrid);
    render();
  };

  document.getElementById('btnClear').onclick = () => {
    saveState();
    for (let i = 0; i < pixels.length; i += 4) {
      pixels[i] = BG_COLOR[0]; pixels[i+1] = BG_COLOR[1]; pixels[i+2] = BG_COLOR[2]; pixels[i+3] = BG_COLOR[3];
    }
    render();
  };

  document.getElementById('btnExport').onclick = () => {
    gl.uniform1f(uShowGridLoc, 0.0);
    render();
    const a = document.createElement('a');
    a.download = 'pixelbras-art.png';
    a.href = canvas.toDataURL();
    a.click();
    gl.uniform1f(uShowGridLoc, showGrid ? 1.0 : 0.0);
    render();
  };

  window.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      redo();
    } else if (!e.ctrlKey && !e.metaKey) {
      const key = e.key.toLowerCase();
      if (key === 'b') selectTool('brush');
      if (key === 'g') selectTool('bucket');
      if (key === 'i') selectTool('picker');
      if (key === 'l') selectTool('line');
      if (key === 'r') selectTool('rect');
      if (key === 'e') selectTool('eraser');
    }
  };

  for (let i = 0; i < pixels.length; i += 4) {
    pixels[i] = BG_COLOR[0]; pixels[i+1] = BG_COLOR[1]; pixels[i+2] = BG_COLOR[2]; pixels[i+3] = BG_COLOR[3];
  }
  render();
</script>
</body>
</html>
